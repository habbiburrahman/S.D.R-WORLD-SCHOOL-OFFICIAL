
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Online Fee Payment - SDR World School</title>
<link rel="stylesheet" href="feepage.css">

</head>

<body>

<header class="header">
    <h1>S.D.R WORLD SCHOOL</h1>
    <p>Online Fee Payment Portal</p>
</header>

<div class="payment-container">

    <h2>Student Fee Payment</h2>

    <form id="feeForm">

        <div class="form-group">
            <label>Student Name *</label>
            <input type="text" id="studentName"
            placeholder="Enter Student Name" required>
        </div>

        <div class="form-group">
            <label>Admission Number *</label>
            <input type="text" id="admissionNo"
            placeholder="Enter Admission Number" required>
        </div>

        <div class="form-group">
            <label>Class *</label>
            <select id="studentClass" required>
                <option value="">Select Class</option>
                <option>Nursery</option>
                <option>LKG</option>
                <option>UKG</option>
                <option>Class 1</option>
                <option>Class 2</option>
                <option>Class 3</option>
                <option>Class 4</option>
                <option>Class 5</option>
                <option>Class 6</option>
                <option>Class 7</option>
                <option>Class 8</option>
            </select>
        </div>

        <div class="form-group">
            <label>Parent Mobile Number *</label>
            <input type="tel" id="mobile"
            placeholder="10 Digit Mobile Number"
            pattern="[0-9]{10}" maxlength="10" required>
        </div>

        <div class="form-group">
            <label>Fee Type *</label>
            <select id="feeType" required>
                <option value="">Select Fee Type</option>
                <option>Admission Fee</option>
                <option>Tuition Fee</option>
                <option>Annual Fee</option>
                <option>Transport Fee</option>
                <option>Other Fee</option>
            </select>
        </div>

        <div class="amount-box">
            <p>Amount Payable</p>
            <h3>Amount will be confirmed by school</h3>
        </div>

        <button type="submit" class="pay-btn">
            PROCEED TO PAY
        </button>

    </form>

    <p class="note">
        Note: Online payment gateway integration is pending.
        Do not enter card details, UPI PIN or banking passwords
        on this page.
    </p>

</div>

<div class="footer">
    © 2026 S.D.R WORLD SCHOOL | All Rights Reserved
</div>

<script src="feepage.js"></script>



</body>
</html>
